# Use golangci-lint's default linters (errcheck, gosimple, govet, ineffassign,
# staticcheck, unused). This previously used `enable-all: true`, which is fragile
# across golangci-lint upgrades (each release adds linters -> new failures) and is
# discouraged upstream; it also referenced the now-removed `gomnd` linter.
run:
  timeout: 10m
  issues-exit-code: 1
  # Don't lint _test.go files. session_test.go is windows-only and embeds the old
  # testify (v1.2.2) suite.Suite; golangci-lint's typecheck can't resolve its methods
  # when cross-compiling (GOOS=windows) on the Linux CI runner. Production code is
  # still fully linted; the test suite itself is exercised by the Windows `test` job.
  tests: false
